<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PF Web Polyglot + C (Stub)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      color: #fff; display: none; align-items: center; justify-content: center;
      font-size: 1.5rem; z-index: 9999;
    }
    .log { margin-top: 1rem; padding: .5rem .75rem; background: #f5f5f5; border-radius: 6px; }
    button { margin-right: .5rem; }
  </style>
</head>
<body>
  <h1>PF Web Polyglot + C (Stub)</h1>
  <p>This is a minimal stub page to satisfy Playwright E2E tests.</p>
  <div>
    <button id="btn-c">Trigger C Trap</button>
  </div>
  <div id="log-c" class="log"></div>
  <div id="overlay"><div>Faux crash overlay</div></div>

  <script>
    const logC = document.getElementById('log-c');
    const overlay = document.getElementById('overlay');

    document.getElementById('btn-c').addEventListener('click', () => {
      logC.textContent = 'Caught C trap: simulated';
      overlay.style.display = 'flex';
    });
  </script>
</body>
</html>
