<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PF Web Cautionary (Stub)</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      color: #fff; display: none; align-items: center; justify-content: center;
      font-size: 1.5rem; z-index: 9999;
    }
    .log { margin-top: 1rem; padding: .5rem .75rem; background: #f5f5f5; border-radius: 6px; }
    button { margin-right: .5rem; }
  </style>
</head>
<body>
  <h1>PF Web Cautionary (Stub)</h1>
  <p>This is a minimal stub page to satisfy Playwright E2E tests.</p>
  <div>
    <button id="btn-trap">Trigger Trap</button>
    <button id="btn-oob">Trigger OOB</button>
    <button id="btn-crash">Show Faux Crash</button>
  </div>
  <div id="log-unreach" class="log"></div>
  <div id="log-oob" class="log"></div>
  <div id="overlay"><div>Faux crash overlay</div></div>

  <script>
    const logUnreach = document.getElementById('log-unreach');
    const logOob = document.getElementById('log-oob');
    const overlay = document.getElementById('overlay');

    document.getElementById('btn-trap').addEventListener('click', () => {
      logUnreach.textContent = 'Caught trap: simulated';
    });
    document.getElementById('btn-oob').addEventListener('click', () => {
      logOob.textContent = 'Caught trap: simulated';
    });
    document.getElementById('btn-crash').addEventListener('click', () => {
      overlay.style.display = 'flex';
    });
  </script>
</body>
</html>
