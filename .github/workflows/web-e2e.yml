name: Web E2E (Playwright)

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D @playwright/test@^1.48.0
          npx playwright install --with-deps

      - name: Start static servers (polyglot + cautionary)
        run: |
          node tools/static-server.mjs demos/pf-web-polyglot-demo-plus-c/web 8080 &
          node tools/static-server.mjs demos/pf-web-cautionary-segfault/web 8082 &
          sleep 2

      - name: Run Playwright tests
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
